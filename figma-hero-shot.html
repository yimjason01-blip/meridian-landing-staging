<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aleron MD Figma Rebase</title>
  <style>
    :root {
      --page-bg: #fffefb;
      --frame-w: 1728;
      --hero-h: 968;
      --curve-h: 861;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--page-bg);
      overflow-x: hidden;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: 100%;
      overflow: hidden;
      background: var(--page-bg);
    }

    .figma-frame {
      position: relative;
      width: 100vw;
      overflow: hidden;
      isolation: isolate;
      background: var(--page-bg);
    }

    .hero {
      height: min(calc(100vw * var(--hero-h) / var(--frame-w)), 100svh);
      min-height: 420px;
      background: #414c6a;
    }

    .curve-section {
      aspect-ratio: 1728 / 861;
    }

    .figma-export {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0;
      visibility: hidden;
      transition: opacity 360ms ease;
    }

    .figma-export.is-active,
    .curve-section .figma-export {
      opacity: 1;
      visibility: visible;
    }

    .figma-export img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      user-select: none;
      pointer-events: none;
    }

    .section-gap {
      width: 100vw;
      height: calc(100vw * 75 / 1728);
      min-height: 36px;
      background: var(--page-bg);
    }

    .hotspot {
      position: absolute;
      z-index: 2;
      display: block;
      min-width: 44px;
      min-height: 44px;
      border: 0;
      background: transparent;
      color: transparent;
      text-decoration: none;
      cursor: pointer;
    }

    .top-action-hotspot {
      left: 89.930556%;
      top: 3.512397%;
      width: 7.928241%;
      height: 6.095041%;
    }

    .demo-hotspot {
      left: 4.166667%;
      top: 87.293388%;
      width: 8.101852%;
      height: 6.301653%;
    }

    .play-hotspot {
      left: 45.138889%;
      top: 25.087108%;
      width: 7.928241%;
      height: 6.852497%;
    }

    .hotspot:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 4px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      .hero {
        min-height: 620px;
      }

      .figma-export img {
        width: auto;
        min-width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .hero .figma-export img {
        object-position: 58% 50%;
      }

      .curve-section {
        min-height: 520px;
      }

      .curve-section .figma-export img {
        object-position: center top;
      }

      .top-action-hotspot {
        left: auto;
        right: 7%;
        top: 28px;
        width: 112px;
      }

      .demo-hotspot {
        left: 7%;
        top: auto;
        bottom: 52px;
        width: 112px;
      }

      .play-hotspot {
        left: 50%;
        top: 25%;
        width: 116px;
        transform: translateX(-50%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .figma-export {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="figma-frame hero" aria-label="Aleron MD hero" data-source="Figma Hero Treatment">
      <picture class="figma-export is-active" data-slide="0" data-figma-node="674:41401">
        <img src="assets/figma-hero-rebase/hero-01-674-41401.png" alt="Aleron MD: Your best days are still ahead." />
      </picture>
      <picture class="figma-export" data-slide="1" data-figma-node="674:41815">
        <img src="assets/figma-hero-rebase/hero-02-674-41815.png" alt="Aleron MD hero slide." loading="eager" />
      </picture>
      <picture class="figma-export" data-slide="2" data-figma-node="674:42168">
        <img src="assets/figma-hero-rebase/hero-03-674-42168.png" alt="Aleron MD hero slide." loading="eager" />
      </picture>
      <picture class="figma-export" data-slide="3" data-figma-node="674:42997">
        <img src="assets/figma-hero-rebase/hero-04-674-42997.png" alt="Aleron MD hero slide." loading="eager" />
      </picture>
      <a class="hotspot top-action-hotspot" href="#apply"><span class="sr-only">Apply</span></a>
      <a class="hotspot demo-hotspot" href="#demo"><span class="sr-only">Demo</span></a>
    </section>

    <div class="section-gap" aria-hidden="true"></div>

    <section class="figma-frame curve-section" aria-label="Future curve section" data-figma-node="674:41519">
      <picture class="figma-export is-active">
        <img src="assets/figma-hero-rebase/curve-674-41519.png" alt="The story of your future is written on top of this curve." loading="eager" />
      </picture>
      <a class="hotspot play-hotspot" href="#play-video"><span class="sr-only">Play Video</span></a>
    </section>
  </main>

  <script>
    const slides = Array.from(document.querySelectorAll('.hero .figma-export'));
    let activeSlide = 0;

    function showSlide(index) {
      activeSlide = (index + slides.length) % slides.length;
      slides.forEach((slide, slideIndex) => {
        slide.classList.toggle('is-active', slideIndex === activeSlide);
      });
    }

    if (slides.length > 1 && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      window.setInterval(() => showSlide(activeSlide + 1), 6500);
    }
  </script>
</body>
</html>
